name: Build AX6000 OpenWrt 25.12.5 image

on:
  push:
    branches:
      - firmware/ax6000-25.12.5
    paths:
      - .github/workflows/build-ax6000-image.yml
      - scripts/build-ax6000-image.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: AX6000 stock-layout sysupgrade image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify image
        run: bash scripts/build-ax6000-image.sh
      - name: Upload firmware and manifest
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-ax6000-stock-awg3.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
