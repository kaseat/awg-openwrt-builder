name: Build AmneziaWG OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      openwrt_release:
        description: OpenWrt release
        default: "25.12.5"
        required: true
      target:
        description: OpenWrt target
        default: "mediatek"
        required: true
      subtarget:
        description: OpenWrt subtarget
        default: "filogic"
        required: true
      pkgarch:
        description: OpenWrt package architecture
        default: "aarch64_cortex-a53"
        required: true
      sdk_variant:
        description: OpenWrt SDK variant
        default: "gcc-14.3.0_musl"
        required: true
  push:
    tags:
      - "awg3.1-*"

permissions:
  contents: write

env:
  AWG_KERNEL_TAG: v3.1.20260906
  AWG_KERNEL_HASH: e32fa46f1b6f9e319c5261f0b0765c3a9261e40cb7c4616fd73500da961a2932
  AWG_TOOLS_TAG: v3.1.20260812
  AWG_TOOLS_HASH: dbd8ce0748d835d18f30bb76720246b7bfc80bd09cd17c379b1c59f683a18493

jobs:
  resolve:
    name: resolve build tuple
    runs-on: ubuntu-latest
    outputs:
      openwrt_release: ${{ steps.resolve.outputs.openwrt_release }}
      target: ${{ steps.resolve.outputs.target }}
      subtarget: ${{ steps.resolve.outputs.subtarget }}
      pkgarch: ${{ steps.resolve.outputs.pkgarch }}
      sdk_variant: ${{ steps.resolve.outputs.sdk_variant }}
      package_ext: ${{ steps.resolve.outputs.package_ext }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      build_id: ${{ steps.resolve.outputs.build_id }}
    steps:
      - id: resolve
        name: Resolve build tuple
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            openwrt_release="${{ inputs.openwrt_release || '25.12.5' }}"
            target="${{ inputs.target || 'mediatek' }}"
            subtarget="${{ inputs.subtarget || 'filogic' }}"
            pkgarch="${{ inputs.pkgarch || 'aarch64_cortex-a53' }}"
            sdk_variant="${{ inputs.sdk_variant || 'gcc-14.3.0_musl' }}"
            release_id="awg3.1-${openwrt_release}-${target}-${subtarget}-${pkgarch}"
            case "${openwrt_release}" in
              25.12.*)
                package_ext="apk"
                case "${sdk_variant}" in
                  gcc-14.*_musl) ;;
                  *)
                    echo "OpenWrt ${openwrt_release} expects a gcc-14.x_musl SDK variant, got: ${sdk_variant}" >&2
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "Unsupported OpenWrt release: ${openwrt_release}" >&2
                exit 1
                ;;
            esac
          else
            tag="${GITHUB_REF_NAME}"
            case "${tag}" in
              awg3.1-*) ;;
              *)
                echo "Invalid build tag: ${tag}; expected awg3.1-<release>-<target>-<subtarget>-<pkgarch>" >&2
                exit 1
                ;;
            esac
            tuple="${tag#awg3.1-}"
            case "${tuple}" in
              *-*-*-*) ;;
              *)
                echo "Invalid build tag: ${tag}; expected awg3.1-<release>-<target>-<subtarget>-<pkgarch>" >&2
                exit 1
                ;;
            esac
            IFS='-' read -r openwrt_release target subtarget pkgarch <<< "${tuple}"
            for value in "${openwrt_release}" "${target}" "${subtarget}" "${pkgarch}"; do
              test -n "${value}"
            done
            case "${openwrt_release}" in
              25.12.*)
                sdk_variant="gcc-14.3.0_musl"
                package_ext="apk"
                ;;
              *)
                echo "Unsupported OpenWrt release in tag: ${openwrt_release}" >&2
                exit 1
                ;;
            esac
            release_id="${tag}"
          fi

          build_id="awg3.1_${openwrt_release}_${target}_${subtarget}_${pkgarch}"
          {
            echo "openwrt_release=${openwrt_release}"
            echo "target=${target}"
            echo "subtarget=${subtarget}"
            echo "pkgarch=${pkgarch}"
            echo "sdk_variant=${sdk_variant}"
            echo "package_ext=${package_ext}"
            echo "release_id=${release_id}"
            echo "build_id=${build_id}"
          } >> "${GITHUB_OUTPUT}"

  build-kmod:
    name: kmod-amneziawg
    runs-on: ubuntu-latest
    needs: resolve
    env:
      OPENWRT_RELEASE: ${{ needs.resolve.outputs.openwrt_release }}
      OPENWRT_TARGET: ${{ needs.resolve.outputs.target }}
      OPENWRT_SUBTARGET: ${{ needs.resolve.outputs.subtarget }}
      OPENWRT_PKGARCH: ${{ needs.resolve.outputs.pkgarch }}
      OPENWRT_SDK_VARIANT: ${{ needs.resolve.outputs.sdk_variant }}
      OPENWRT_PACKAGE_EXT: ${{ needs.resolve.outputs.package_ext }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      BUILD_ID: ${{ needs.resolve.outputs.build_id }}
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Download OpenWrt SDK
        run: |
          set -euo pipefail
          sdk_name="openwrt-sdk-${OPENWRT_RELEASE}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}_${OPENWRT_SDK_VARIANT}.Linux-x86_64.tar.zst"
          sdk_url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${sdk_name}"
          mkdir -p sdk
          curl -L --fail --retry 3 --output sdk/sdk.tar.zst "${sdk_url}"
          tar -I zstd -xf sdk/sdk.tar.zst -C sdk
          sdk_dir="$(find "$PWD/sdk" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)"
          test -n "${sdk_dir}"
          printf '%s\n' "${sdk_dir}" > sdk/.dir

      - name: Build kmod package
        working-directory: sdk
        run: |
          set -euo pipefail
          sdk_dir="$(cat .dir)"
          dist_root="${GITHUB_WORKSPACE}/dist/${OPENWRT_RELEASE}/${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}-${OPENWRT_PKGARCH}"
          mkdir -p "${sdk_dir}/package/awgopenwrt"
          cp -a ../builder/packages/kmod-amneziawg "${sdk_dir}/package/awgopenwrt/"
          cd "${sdk_dir}"
          # The release SDK embeds buildbot kmod selections as defaults.
          # Reset those defaults before expanding the package configuration.
          echo "SDK kmod defaults: $(grep -c '^config PACKAGE_kmod-' Config-build.in || true)"
          grep -A2 -m1 '^config PACKAGE_kmod-' Config-build.in || true
          sed -i -E '/^config PACKAGE_kmod-[^ ]+$/,/^$/ s/^[[:space:]]*default [my]$/\tdefault n/' Config-build.in
          grep -A2 -m1 '^config PACKAGE_kmod-' Config-build.in || true
          make defconfig
          echo "Initially selected kmods: $(grep -Ec '^CONFIG_PACKAGE_kmod-[^=]+=[my]$' .config || true)"
          sed -i -E \
            -e 's/^CONFIG_PACKAGE_(kmod-[^=]+)=[my]$/# CONFIG_PACKAGE_\1 is not set/' \
            -e '/^(# )?CONFIG_ALL(_NONSHARED|_KMODS)?(=| is not set)/d' \
            .config
          {
            echo "# CONFIG_ALL is not set"
            echo "# CONFIG_ALL_NONSHARED is not set"
            echo "# CONFIG_ALL_KMODS is not set"
          } >> .config
          for pkg in \
            kmod-amneziawg \
            kmod-crypto-lib-chacha20 \
            kmod-crypto-lib-chacha20poly1305 \
            kmod-crypto-chacha20poly1305 \
            kmod-crypto-lib-curve25519 \
            kmod-udptunnel4 \
            kmod-udptunnel6
          do
            sed -i "/^# CONFIG_PACKAGE_${pkg} is not set$/d" .config
            echo "CONFIG_PACKAGE_${pkg}=m" >> .config
          done
          echo "Selected kmods before second defconfig: $(grep -Ec '^CONFIG_PACKAGE_kmod-[^=]+=[my]$' .config || true)"
          make defconfig
          grep -qx '# CONFIG_ALL is not set' .config
          grep -qx '# CONFIG_ALL_NONSHARED is not set' .config
          grep -qx '# CONFIG_ALL_KMODS is not set' .config
          grep -qx 'CONFIG_PACKAGE_kmod-amneziawg=m' .config
          selected_kmods="$(grep -Ec '^CONFIG_PACKAGE_kmod-[^=]+=[my]$' .config || true)"
          echo "Selected kernel-module packages: ${selected_kmods}"
          test "${selected_kmods}" -le 100
          make package/awgopenwrt/kmod-amneziawg/clean
          make package/awgopenwrt/kmod-amneziawg/compile -j"$(nproc)" V=s
          mkdir -p "${dist_root}"
          find bin -type f \( -name "kmod-amneziawg-*.${OPENWRT_PACKAGE_EXT}" -o -name "kmod-amneziawg_*.${OPENWRT_PACKAGE_EXT}" \) -exec cp {} "${dist_root}/" \;

      - name: Upload kmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.BUILD_ID }}-kmod-amneziawg
          path: "dist/${{ env.OPENWRT_RELEASE }}/${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ env.OPENWRT_PKGARCH }}/*.${{ env.OPENWRT_PACKAGE_EXT }}"
          if-no-files-found: error

  build-luci:
    name: luci-proto-amneziawg
    runs-on: ubuntu-latest
    needs: resolve
    env:
      OPENWRT_RELEASE: ${{ needs.resolve.outputs.openwrt_release }}
      OPENWRT_TARGET: ${{ needs.resolve.outputs.target }}
      OPENWRT_SUBTARGET: ${{ needs.resolve.outputs.subtarget }}
      OPENWRT_PKGARCH: ${{ needs.resolve.outputs.pkgarch }}
      OPENWRT_SDK_VARIANT: ${{ needs.resolve.outputs.sdk_variant }}
      OPENWRT_PACKAGE_EXT: ${{ needs.resolve.outputs.package_ext }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      BUILD_ID: ${{ needs.resolve.outputs.build_id }}
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Download OpenWrt SDK
        run: |
          set -euo pipefail
          sdk_name="openwrt-sdk-${OPENWRT_RELEASE}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}_${OPENWRT_SDK_VARIANT}.Linux-x86_64.tar.zst"
          sdk_url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${sdk_name}"
          mkdir -p sdk
          curl -L --fail --retry 3 --output sdk/sdk.tar.zst "${sdk_url}"
          tar -I zstd -xf sdk/sdk.tar.zst -C sdk
          sdk_dir="$(find "$PWD/sdk" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)"
          test -n "${sdk_dir}"
          printf '%s\n' "${sdk_dir}" > sdk/.dir

      - name: Build LuCI protocol package
        working-directory: sdk
        run: |
          set -euo pipefail
          sdk_dir="$(cat .dir)"
          dist_root="${GITHUB_WORKSPACE}/dist/${OPENWRT_RELEASE}/${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}-${OPENWRT_PKGARCH}"
          mkdir -p "${sdk_dir}/package/awgopenwrt"
          cp -a ../builder/packages/luci-proto-amneziawg "${sdk_dir}/package/awgopenwrt/"
          cd "${sdk_dir}"
          {
            echo "CONFIG_PACKAGE_luci-proto-amneziawg=m"
          } >> .config
          make defconfig
          make package/awgopenwrt/luci-proto-amneziawg/clean
          make package/awgopenwrt/luci-proto-amneziawg/compile -j"$(nproc)" V=s
          mkdir -p "${dist_root}"
          find bin -type f \( -name "luci-proto-amneziawg-*.${OPENWRT_PACKAGE_EXT}" -o -name "luci-proto-amneziawg_*.${OPENWRT_PACKAGE_EXT}" \) -exec cp {} "${dist_root}/" \;

      - name: Upload LuCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.BUILD_ID }}-luci-proto-amneziawg
          path: "dist/${{ env.OPENWRT_RELEASE }}/${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ env.OPENWRT_PKGARCH }}/*.${{ env.OPENWRT_PACKAGE_EXT }}"
          if-no-files-found: error

  build-tools:
    name: amneziawg-tools
    runs-on: ubuntu-latest
    needs: resolve
    env:
      OPENWRT_RELEASE: ${{ needs.resolve.outputs.openwrt_release }}
      OPENWRT_TARGET: ${{ needs.resolve.outputs.target }}
      OPENWRT_SUBTARGET: ${{ needs.resolve.outputs.subtarget }}
      OPENWRT_PKGARCH: ${{ needs.resolve.outputs.pkgarch }}
      OPENWRT_SDK_VARIANT: ${{ needs.resolve.outputs.sdk_variant }}
      OPENWRT_PACKAGE_EXT: ${{ needs.resolve.outputs.package_ext }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      BUILD_ID: ${{ needs.resolve.outputs.build_id }}
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Download OpenWrt SDK
        run: |
          set -euo pipefail
          sdk_name="openwrt-sdk-${OPENWRT_RELEASE}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}_${OPENWRT_SDK_VARIANT}.Linux-x86_64.tar.zst"
          sdk_url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${sdk_name}"
          mkdir -p sdk
          curl -L --fail --retry 3 --output sdk/sdk.tar.zst "${sdk_url}"
          tar -I zstd -xf sdk/sdk.tar.zst -C sdk
          sdk_dir="$(find "$PWD/sdk" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)"
          test -n "${sdk_dir}"
          printf '%s\n' "${sdk_dir}" > sdk/.dir

      - name: Build userspace package
        working-directory: sdk
        run: |
          set -euo pipefail
          sdk_dir="$(cat .dir)"
          dist_root="${GITHUB_WORKSPACE}/dist/${OPENWRT_RELEASE}/${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}-${OPENWRT_PKGARCH}"
          mkdir -p "${sdk_dir}/package/awgopenwrt"
          cp -a ../builder/packages/amneziawg-tools "${sdk_dir}/package/awgopenwrt/"
          cd "${sdk_dir}"
          make defconfig
          make package/awgopenwrt/amneziawg-tools/clean
          make package/awgopenwrt/amneziawg-tools/compile -j"$(nproc)" V=s
          mkdir -p "${dist_root}"
          find bin -type f \( -name "amneziawg-tools-*.${OPENWRT_PACKAGE_EXT}" -o -name "amneziawg-tools_*.${OPENWRT_PACKAGE_EXT}" \) -exec cp {} "${dist_root}/" \;

      - name: Upload userspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.BUILD_ID }}-amneziawg-tools
          path: "dist/${{ env.OPENWRT_RELEASE }}/${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ env.OPENWRT_PKGARCH }}/*.${{ env.OPENWRT_PACKAGE_EXT }}"
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - resolve
      - build-kmod
      - build-luci
      - build-tools
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      OPENWRT_RELEASE: ${{ needs.resolve.outputs.openwrt_release }}
      OPENWRT_TARGET: ${{ needs.resolve.outputs.target }}
      OPENWRT_SUBTARGET: ${{ needs.resolve.outputs.subtarget }}
      OPENWRT_PKGARCH: ${{ needs.resolve.outputs.pkgarch }}
      OPENWRT_SDK_VARIANT: ${{ needs.resolve.outputs.sdk_variant }}
      OPENWRT_PACKAGE_EXT: ${{ needs.resolve.outputs.package_ext }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      BUILD_ID: ${{ needs.resolve.outputs.build_id }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Rename packages
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for pkg in \
            amneziawg-tools \
            kmod-amneziawg \
            luci-proto-amneziawg
          do
            src="$(find release -type f \( -name "${pkg}*.${OPENWRT_PACKAGE_EXT}" -o -name "${pkg}_*.${OPENWRT_PACKAGE_EXT}" \) | head -n1)"
            test -n "${src}"
            cp "${src}" "release-assets/openwrt-${BUILD_ID}-${pkg}.${OPENWRT_PACKAGE_EXT}"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_ID }}
          files: "release-assets/*.${{ env.OPENWRT_PACKAGE_EXT }}"
